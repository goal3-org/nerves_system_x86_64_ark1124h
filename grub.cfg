# Firmware boot script
#
# This script expects the following Grub2 modules to be compiled
# into the grub binary (grub.img), which post-build.sh builds:
#
# boot linux squash4 ext2 fat part_msdos normal biosdisk loadenv echo true test sleep regexp probe
#
# grub.img carries the prefix "(,msdos1)/boot/grub": GRUB fills in the disk it
# was loaded from, so $root is that disk's first partition whatever number the
# BIOS gave the disk. Everything below stays on that disk -- the kernel is
# loaded from it, and the kernel is told that disk's own partition UUID, read
# at boot -- so a USB medium never boots an internal disk's kernel or rootfs
# (nor the other way round), even on a BIOS that keeps the internal disk as
# hd0 while booting from USB. Nothing here depends on the fixed MBR disk
# signatures in fwup.conf.

# Load the environment for the validation/fallback settings
# (image validation/fallback not added here yet...)
load_env

# The disk this GRUB was loaded from, e.g. "hd1" from "hd1,msdos1".
if regexp --set=1:disk '^(hd[0-9]+)' "$root"; then true; else set disk=hd0; fi

# Boot A or B depending on which one is active
if [ $boot = 1 ]; then
     echo "Booting partition B..."
     set part=($disk,msdos3)
else
     echo "Booting partition A..."
     set part=($disk,msdos2)
fi

probe --set=partuuid --part-uuid $part
echo "Kernel and root: $part (PARTUUID=$partuuid)"
linux $part/boot/bzImage root=PARTUUID=$partuuid rootwait console=tty1 console=ttyS0 cgroup_no_v1=all

# Boot!!!
boot
